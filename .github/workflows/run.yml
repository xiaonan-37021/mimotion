name: 刷步数

on:
  schedule:
    - cron: '40 0,2,4,6,8,14 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master

  unifuncs:
    name: U 深搜签到（独立任务）
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    concurrency:
      group: unifuncs-checkin
      cancel-in-progress: false
    steps:
      - name: 判断签到时段
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(date -u +%H)
          if [ "$EVENT_NAME" != "schedule" ] || { [ "$hour" -ge 1 ] && [ "$hour" -le 15 ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = "schedule" ] && [ "$hour" -ge 1 ] && [ "$hour" -lt 4 ]; then
            echo "random=true" >> "$GITHUB_OUTPUT"
          else
            echo "random=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 获取签到脚本
        if: steps.window.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 随机等待 0～20 分钟（上午主任务）
        if: steps.window.outputs.random == 'true'
        run: |
          python3 -u - <<'PY'
          import secrets
          import time
          delay = secrets.randbelow(1201)
          print(f"随机等待 {delay // 60} 分 {delay % 60} 秒", flush=True)
          time.sleep(delay)
          PY
      - name: 检查并签到
        if: steps.window.outputs.enabled == 'true'
        env:
          UNIFUNCS_COOKIE: ${{ secrets.UNIFUNCS_COOKIE }}
        run: python3 unifuncs/checkin.py
