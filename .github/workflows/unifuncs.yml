name: U 深搜每日签到
on:
  schedule:
    # UTC 02:40 = 北京时间 10:40，每天仅一次。
    - cron: '40 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unifuncs-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 获取签到脚本
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 随机等待 0～20 分钟
        if: github.event_name == 'schedule'
        run: |
          python3 -u - <<'PY'
          import secrets
          import time
          delay = secrets.randbelow(1201)
          print(f"随机等待 {delay // 60} 分 {delay % 60} 秒", flush=True)
          time.sleep(delay)
          PY
      - name: 检查并签到
        env:
          UNIFUNCS_COOKIE: ${{ secrets.UNIFUNCS_COOKIE }}
        run: python3 unifuncs/checkin.py
